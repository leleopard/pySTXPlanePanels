[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pySTXPlanePanels"
version = "0.0.1"
description = "Python based cockpit panel that displays X Plane aircraft gauges over UDP"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Stephane Teisserenc" }]
dependencies = [
    "arcade>=3.3,<4",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "pyxpudpserver",
    "PySide6>=6.5",
]

[project.scripts]
plane-gauge = "gauge_core.runner:main"
gauge-designer = "gauge_designer.__main__:main"

[tool.setuptools.packages.find]
include = ["gauge_core*", "gauge_designer*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "numpy>=1.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The render tier needs a GPU and golden images, so it is opt-in: run it
# with `pytest -m render` or, preferably, via `python scripts/regress.py`
# which picks the tier from what actually changed.
addopts = "-m 'not render' --strict-markers"
