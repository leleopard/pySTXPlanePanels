# C172 Six-Pack Panel — composes the seven C172 instruments into a
# single Arcade window.
#
# Position convention: each instrument's `position` is the panel coord
# of the instrument's bottom-left corner. The original pyXPPanels layout
# used a 300-px grid combined with a 0.97 zoom on the 310-px bezels;
# until per-instrument scale is implemented we use a 310-px grid so
# bezels don't overlap. ASI stays anchored at the original centre
# (170, 670); the other instruments shift right/down by up to 20 px
# from the historical positions.
#
# Six-pack grid centres (310 spacing):
#   row 0 (y=670):  ASI (170)   AH (480)    ALT (790)
#   row 1 (y=360):  TC  (170)   DG  (480)   VSI (790)
# Annunciator centre: (635, 860) — recentred between AH and ALT.

name: C172 Six-Pack
size: [960, 920]
background_color: [0, 0, 0]

udp:
  listen_port: 49008

instruments:
  # Top row
  - file: ../instruments/c172_airspeed.yaml
    position: [15, 515]
  - file: ../instruments/c172_artificial_horizon.yaml
    position: [325, 515]
  - file: ../instruments/c172_altimeter.yaml
    position: [635, 515]

  # Bottom row
  - file: ../instruments/c172_turn_coordinator.yaml
    position: [15, 205]
  - file: ../instruments/c172_directional_gyro.yaml
    position: [325, 205]
  - file: ../instruments/c172_vsi.yaml
    position: [635, 205]

  # Annunciator above the six-pack, centred on the panel's x-axis
  - file: ../instruments/c172_annunciator.yaml
    position: [412, 827]
