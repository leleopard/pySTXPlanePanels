# C172 Six-Pack Panel — composes the seven C172 instruments into a
# single Arcade window.
#
# Position convention: each instrument's `position` is the panel coord
# of the instrument's bottom-left corner. To recreate the original
# pyXPPanels layout (center-anchored coords) the conversion is
# `bottom_left = original_center - instrument_size/2`. Numbers below
# are derived from C172_Panel.py:
#
#   std6_orig = [170, 670]      -> top-left ASI centre
#   std6_xgrid / std6_ygrid     = 300px instrument-to-instrument grid
#   ANNUNCIATOR_pos = [620, 860]
#
# Six-pack grid (centres):
#   row 0 (y=670):  ASI (170)   AH (470)    ALT (770)
#   row 1 (y=370):  TC  (170)   DG  (470)   VSI (770)
# Annunciator centre: (620, 860).

name: C172 Six-Pack
size: [950, 920]
background_color: [0, 0, 0]

instruments:
  # Top row
  - file: ../instruments/c172_airspeed.yaml
    position: [15, 515]
  - file: ../instruments/c172_artificial_horizon.yaml
    position: [315, 515]
  - file: ../instruments/c172_altimeter.yaml
    position: [615, 515]

  # Bottom row
  - file: ../instruments/c172_turn_coordinator.yaml
    position: [15, 215]
  - file: ../instruments/c172_directional_gyro.yaml
    position: [315, 215]
  - file: ../instruments/c172_vsi.yaml
    position: [615, 215]

  # Annunciator above the six-pack
  - file: ../instruments/c172_annunciator.yaml
    position: [397, 827]
