# B737 Attitude Indicator — procedural glass-cockpit AI
# Driven by pitch and roll datarefs; all geometry generated each frame.
name: B737 Attitude Indicator
size: [340, 340]
components:
  - type: AttitudeIndicator
    name: ai
    viewport: [20, 20, 300, 300]
    pitch_dataref: sim/cockpit2/gauges/indicators/pitch_deg
    roll_dataref:  sim/cockpit2/gauges/indicators/roll_deg_vacuum
    pixels_per_degree: 8.0
    ladder_step: 2.5
    sky_color:          [0, 100, 180, 255]
    ground_color:       [100, 60,  10, 255]
    horizon_color:      [255, 255, 255, 255]
    horizon_width:      3.0
    ladder_color:       [255, 255, 255, 255]
    ladder_width:       2.0
    label_font_size:    14
    bank_arc_color:     [255, 255, 255, 255]
    bank_arc_width:     2.0
    roll_pointer_color: [255, 255, 255, 255]
    roll_pointer_size:  12.0
