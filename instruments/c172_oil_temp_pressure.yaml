# C172 Oil Temperature / Pressure gauge.
# Dual-needle 200×200 gauge sharing the standard6 atlas.
# Right needle = oil temperature (deg C), left needle = oil pressure (PSI).
# Atlas coordinates (PIL top-left origin, atlas is 2048×2048):
#   background  : row 5 from bottom  → opengl y=1048 → PIL y=800
#   needles     : shared strip at PIL y=618 (temp) and y=600 (pressure)
#   border      : row 3 from bottom  → opengl y=1448 → PIL y=400
#   side_text   : row 8 from bottom  → opengl y=448  → PIL y=1400
# Component positions are sprite centres in instrument-local coords (y-up).
# The gauge centre in a 200×200 instrument is (100, 100).

name: C172 Oil Temp / Pressure
size: [200, 200]

components:
  - name: background
    type: ImagePanel
    texture: ../assets/c172_text_standard6.png
    origin: [1800, 800]
    cliprect: [200, 200]
    position: [100, 100]

  - name: temp_needle
    type: ImagePanel
    texture: ../assets/c172_text_standard6.png
    origin: [1800, 618]
    cliprect: [110, 18]
    position: [160, 103]
    rotation:
      dataref: sim/cockpit2/engine/indicators/oil_temp_deg_C[0]
      table:
        - [-7.821, -60.5]
        - [100,     36.0]
        - [121.364, 59.5]

  - name: pressure_needle
    type: ImagePanel
    texture: ../assets/c172_text_standard6.png
    origin: [1800, 600]
    cliprect: [110, 18]
    position: [45, 105]
    rotation:
      dataref: sim/cockpit2/engine/indicators/oil_pressure_psi[0]
      table:
        - [58.33,  62.0]
        - [150,    18.0]
        - [200,   -30.0]
        - [257.6, -62.0]

  - name: border
    type: ImagePanel
    texture: ../assets/c172_text_standard6.png
    origin: [1800, 400]
    cliprect: [200, 200]
    position: [100, 100]

  - name: side_text
    type: ImagePanel
    texture: ../assets/c172_text_standard6.png
    origin: [1800, 1400]
    cliprect: [200, 200]
    position: [100, 100]
