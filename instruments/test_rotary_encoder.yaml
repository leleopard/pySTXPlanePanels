name: RotaryEncoder test
size:
- 200
- 200
components:
# Visual label so you can see the instrument window
- name: label
  type: Text
  position:
  - 100
  - 160
  text: "Drag / tap / scroll"
  font_size: 11
  color:
  - 200
  - 200
  - 200
  - 255
- name: label2
  type: Text
  position:
  - 100
  - 140
  text: "left=CCW  right=CW"
  font_size: 11
  color:
  - 200
  - 200
  - 200
  - 255
# Visual outline of the knob area (FilledRect, transparent fill)
- name: knob_outline
  type: FilledRect
  position:
  - 100
  - 90
  size:
  - 60
  - 60
  color:
  - 0
  - 0
  - 0
  - 0
  outline_color:
  - 100
  - 200
  - 100
  - 200
  outline_width: 1.5
# Divider line so left/right halves are visible
- name: knob_centre_line
  type: Line
  start:
  - 100
  - 61
  end:
  - 100
  - 119
  color:
  - 100
  - 200
  - 100
  - 120
  width: 1.0
# The actual interactive component (invisible at runtime)
- name: heading_knob
  type: RotaryEncoder
  position:
  - 100
  - 90
  size:
  - 60
  - 60
  command_cw: sim/autopilot/heading_up
  command_ccw: sim/autopilot/heading_down
  drag_px_per_step: 5
