# C172 Airspeed Indicator — MVP0 single-instrument demo.
#
# Atlas coordinate convention:
#   - origin / cliprect are PIL/image coords: (0,0) top-left, y grows DOWN.
#   - position is Arcade window coord: (0,0) bottom-left, y grows UP. The
#     position is the sprite's centre.
#
# Calibration table for the needle is lifted verbatim from the original
# pyXPPanels/instruments/C172_AirspeedIndicator.py.

name: C172 Airspeed Indicator
size: [310, 310]

components:
  - name: airspeed_background
    type: ImagePanel
    texture: ../assets/c172_text_standard6.png
    cliprect: [300, 300]
    origin: [0, 300]
    position: [155, 155]

  - name: airspeed_needle
    type: ImagePanel
    texture: ../assets/c172_text_standard6.png
    cliprect: [40, 300]
    origin: [730, 1500]
    position: [155, 155]
    rotation:
      dataref: sim/cockpit2/gauges/indicators/airspeed_kts_pilot
      table:
        - [0, 0]
        - [40, 30]
        - [50, 50]
        - [60, 70]
        - [70, 90]
        - [80, 115]
        - [90, 140.5]
        - [95, 151]
        - [100, 162.5]
        - [105, 174]
        - [110, 185]
        - [115, 196]
        - [120, 207.5]
        - [130, 222.5]
        - [140, 237.5]
        - [160, 267.5]
        - [200, 317.5]

  - name: airspeed_bezel
    type: ImagePanel
    texture: ../assets/c172_text_standard6.png
    cliprect: [310, 310]
    origin: [1200, 1500]
    position: [155, 155]
