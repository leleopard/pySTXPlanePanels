# Bendix-King KX165A NAV/COMM Radio (NAVCOMM #1).
#
# Single-radio MVP — proves custom-font rendering, instrument-level
# visibility, and frequency display via the divideby100 convert. The
# whole instrument hides when com1 is unpowered.
#
# Layout: 574-px-wide background image with four DS-Digital orange
# frequency readouts (COM active/standby on the left, NAV
# active/standby on the right), matching pyXPPanels' BK_NAVCOMM_KX165A.
#
# To use NAVCOMM #2: copy this file, switch the dataref index from
# com1/nav1 to com2/nav2, and change the visibility dataref to
# com2_power.

name: BK NAVCOMM 1
size: [574, 70]

visibility:
  dataref: sim/cockpit2/radios/actuators/com1_power[0]
  predicate: true_if_over_zero

components:
  - name: background
    type: ImagePanel
    texture: ../assets/2048_Radio_Stack_text.png
    cliprect: [574, 70]
    origin: [0, 0]
    position: [287, 35]

  - name: com_active_freq
    type: Text
    text: ""
    font_file: ../assets/fonts/DS-Digital-ItalicST.ttf
    font_name: DS-Digital
    font_size: 35
    color: [211, 62, 33]
    position: [9, 22]
    text_format: "{:07.3f}"
    convert_function: divideby100
    dataref: sim/cockpit/radios/com1_freq_hz[0]

  - name: com_standby_freq
    type: Text
    text: ""
    font_file: ../assets/fonts/DS-Digital-ItalicST.ttf
    font_name: DS-Digital
    font_size: 35
    color: [211, 62, 33]
    position: [145, 22]
    text_format: "{:07.3f}"
    convert_function: divideby100
    dataref: sim/cockpit/radios/com1_stdby_freq_hz[0]

  - name: nav_active_freq
    type: Text
    text: ""
    font_file: ../assets/fonts/DS-Digital-ItalicST.ttf
    font_name: DS-Digital
    font_size: 35
    color: [211, 62, 33]
    position: [288, 22]
    text_format: "{:06.2f}"
    convert_function: divideby100
    dataref: sim/cockpit/radios/nav1_freq_hz[0]

  - name: nav_standby_freq
    type: Text
    text: ""
    font_file: ../assets/fonts/DS-Digital-ItalicST.ttf
    font_name: DS-Digital
    font_size: 35
    color: [211, 62, 33]
    position: [408, 22]
    text_format: "{:06.2f}"
    convert_function: divideby100
    dataref: sim/cockpit/radios/nav1_stdby_freq_hz[0]
