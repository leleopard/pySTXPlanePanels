# C172 Fuel Quantity gauge.
# Dual-needle 200×200 gauge.
# Right needle = right (or tank[1]) fuel quantity.
# Left  needle = left  (or tank[0]) fuel quantity.
# X-Plane fuel_quantity is in lbs; convert_lbs_to_gallons (÷6) gives US gallons.
# Atlas origins (PIL):
#   background : opengl y=1848 → PIL y=0
#   text label : opengl y=1648 → PIL y=200
#   border     : PIL y=400

name: C172 Fuel Quantity
size: [200, 200]

components:
  - name: background
    type: ImagePanel
    texture: ../../assets/c172_text_standard6.png
    origin: [1800, 0]
    cliprect: [200, 200]
    position: [100, 100]

  - name: right_needle
    type: ImagePanel
    texture: ../../assets/c172_text_standard6.png
    origin: [1800, 618]
    cliprect: [110, 18]
    position: [157, 104]
    rotation:
      dataref: sim/cockpit2/fuel/fuel_quantity[1]
      convert_function: convert_lbs_to_gallons
      table:
        - [-1.74, -66.0]
        - [20.0,   34.0]
        - [28.08,  65.0]

  - name: left_needle
    type: ImagePanel
    texture: ../../assets/c172_text_standard6.png
    origin: [1800, 600]
    cliprect: [110, 18]
    position: [45, 105]
    rotation:
      dataref: sim/cockpit2/fuel/fuel_quantity[0]
      convert_function: convert_lbs_to_gallons
      table:
        - [-1.74,  62.0]
        - [20.0,  -33.0]
        - [28.08, -64.0]

  - name: border
    type: ImagePanel
    texture: ../../assets/c172_text_standard6.png
    origin: [1800, 400]
    cliprect: [200, 200]
    position: [100, 100]

  - name: side_text
    type: ImagePanel
    texture: ../../assets/c172_text_standard6.png
    origin: [1800, 200]
    cliprect: [200, 200]
    position: [100, 100]
