# C172 ADF indicator (RMI style).
# The compass card rotates opposite to magnetic heading so North stays
# at the top of a heading-up display. The needle points to the absolute
# magnetic bearing of the NDB station.
#
# Atlas origins (PIL):
#   adf_needle   : [300, 0]    cliprect [300, 300]   opengl y=1748
#   compass_rose : [300, 1200] cliprect [300, 300]   (shared with VOR compass)
#   plane        : [600, 0]    cliprect [300, 300]   opengl y=1748
#   bezel        : [1200,1500] cliprect [310, 310]

name: C172 ADF Indicator
size: [310, 310]

components:
  - name: adf_needle
    type: ImagePanel
    texture: assets/c172_text_standard6.png
    origin: [300, 0]
    cliprect: [300, 300]
    position: [155, 155]
    rotation:
      dataref: sim/cockpit/radios/adf1_bearing_deg_mag
      table:
        - [-360, -360.0]
        - [ 360,  360.0]

  - name: compass_rose
    type: ImagePanel
    texture: assets/c172_text_standard6.png
    origin: [300, 1200]
    cliprect: [300, 300]
    position: [155, 155]
    rotation:
      dataref: sim/cockpit2/gauges/indicators/heading_vacuum_deg_mag_pilot
      table:
        - [-360, 360.0]
        - [ 360, -360.0]

  - name: plane
    type: ImagePanel
    texture: assets/c172_text_standard6.png
    origin: [600, 0]
    cliprect: [300, 300]
    position: [155, 155]

  - name: bezel
    type: ImagePanel
    texture: assets/c172_text_standard6.png
    origin: [1200, 1500]
    cliprect: [310, 310]
    position: [155, 155]
