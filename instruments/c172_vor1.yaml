# C172 VOR1 CDI indicator (Bendix-King KI-209 style).
# Components in draw order (first = furthest back):
#   nav_flag / gs_flag  — shown when no valid signal / no glideslope
#   background          — VOR face with CDI window
#   to_indicator        — TO arrow, visible when nav1_flag_from_to == 1
#   from_indicator      — FROM arrow, visible when nav1_flag_from_to == 2
#   cdi_needle          — vertical needle, translates left/right ±65 px at ±2.5 dots
#   gs_needle           — horizontal needle, translates up/down  ±65 px at ±2.5 dots
#   compass_rose        — OBS compass card, rotates opposite to OBS setting
#   dir_arrows          — fixed course-pointer arrows (static overlay)
#   bezel
#
# Atlas origins (PIL, atlas 2048×2048):
#   gs_flag      : [44,  2014]  cliprect [45,  27]
#   nav_flag     : [44,  1939]  cliprect [40,  74]
#   background   : [0,   1200]  cliprect [300, 300]
#   from_ind     : [8,   2010]  cliprect [37,  31]
#   to_ind       : [8,   1979]  cliprect [37,  31]
#   cdi_needle   : [0,   1889]  cliprect [9,   150]
#   gs_needle    : [0,   2040]  cliprect [148, 8]
#   compass_rose : [300, 1200]  cliprect [300, 300]
#   dir_arrows   : [600, 1200]  cliprect [300, 300]
#   bezel        : [1200,1500]  cliprect [310, 310]

name: C172 VOR 1
size: [310, 310]

components:
  - name: nav_flag
    type: ImagePanel
    texture: ../assets/c172_text_standard6.png
    origin: [44, 1939]
    cliprect: [40, 74]
    position: [177, 206]
    visibility:
      dataref: sim/cockpit2/radios/nav1_flag_from_to_pilot
      predicate: true_if_zero

  - name: gs_flag
    type: ImagePanel
    texture: ../assets/c172_text_standard6.png
    origin: [44, 2014]
    cliprect: [45, 27]
    position: [110, 178]
    visibility:
      dataref: sim/cockpit2/radios/nav1_flag_from_to_pilot
      predicate: true_if_zero

  - name: background
    type: ImagePanel
    texture: ../assets/c172_text_standard6.png
    origin: [0, 1200]
    cliprect: [300, 300]
    position: [155, 155]

  - name: to_indicator
    type: ImagePanel
    texture: ../assets/c172_text_standard6.png
    origin: [8, 1979]
    cliprect: [37, 31]
    position: [201, 182]
    visibility:
      dataref: sim/cockpit/radios/nav1_fromto
      predicate: true_if_equals_1

  - name: from_indicator
    type: ImagePanel
    texture: ../assets/c172_text_standard6.png
    origin: [8, 2010]
    cliprect: [37, 31]
    position: [201, 128]
    visibility:
      dataref: sim/cockpit/radios/nav1_fromto
      predicate: true_if_equals_2

  - name: cdi_needle
    type: ImagePanel
    texture: ../assets/c172_text_standard6.png
    origin: [0, 1889]
    cliprect: [9, 150]
    position: [155, 157]
    translation:
      dataref: sim/cockpit/radios/nav1_hdef_dot
      table:
        - [-2.5, -65.0]
        - [ 2.5,  65.0]
      translation_angle: 90

  - name: gs_needle
    type: ImagePanel
    texture: ../assets/c172_text_standard6.png
    origin: [0, 2040]
    cliprect: [148, 8]
    position: [155, 155]
    translation:
      dataref: sim/cockpit2/radios/nav1_vdef_dots
      table:
        - [-2.5,  65.0]
        - [ 2.5, -65.0]

  - name: compass_rose
    type: ImagePanel
    texture: ../assets/c172_text_standard6.png
    origin: [300, 1200]
    cliprect: [300, 300]
    position: [155, 155]
    rotation:
      dataref: sim/cockpit/radios/nav1_obs_degm
      table:
        - [-360, 360.0]
        - [ 360, -360.0]

  - name: dir_arrows
    type: ImagePanel
    texture: ../assets/c172_text_standard6.png
    origin: [600, 1200]
    cliprect: [300, 300]
    position: [155, 155]

  - name: bezel
    type: ImagePanel
    texture: ../assets/c172_text_standard6.png
    origin: [1200, 1500]
    cliprect: [310, 310]
    position: [155, 155]
